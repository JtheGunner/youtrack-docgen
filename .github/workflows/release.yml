name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir dist
          module=github.com/JtheGunner/youtrack-docgen
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="youtrack-docgen_${VERSION}_${os}_${arch}"
            mkdir "dist/${name}"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X ${module}/internal/version.Version=${VERSION} -X ${module}/internal/version.Commit=${COMMIT}" \
              -o "dist/${name}/youtrack-docgen" ./cmd/youtrack-docgen
            cp LICENSE README.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -r "dist/${name}"
          done
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt --title "$VERSION" --generate-notes --verify-tag
